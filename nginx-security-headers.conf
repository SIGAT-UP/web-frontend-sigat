# Cabeceras de seguridad de la web SIGAT. Se incluyen en CADA location de nginx.conf porque
# nginx descarta los add_header heredados del bloque server en cuanto una location define
# su propio add_header (por ejemplo, Cache-Control).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP: solo scripts propios. Si el backend se sirve en OTRO dominio (modo B), docker/40-sigat-config.sh
# agrega ese origen a connect-src al arrancar el contenedor. Fuera de Docker, agréguelo a mano.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Active HSTS solo cuando el sitio se sirva siempre por HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
