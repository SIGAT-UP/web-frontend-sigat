name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tipos y build
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

      - name: Lint
        run: npm run lint
