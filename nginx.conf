server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Las cabeceras de seguridad están en nginx-security-headers.conf y se incluyen en cada location.

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Archivos con hash: caché de un año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/sigat-security-headers.conf;
    try_files $uri =404;
  }

  # API: lo genera docker/40-sigat-config.sh al arrancar el contenedor (ver README, «Despliegue»).
  #  - Modo A (VITE_API_URL=/api/v1): reenvía /api/v1/ a SIGAT_API_UPSTREAM (obligatoria).
  #  - Modo B (VITE_API_URL=https://…): sin proxy; agrega ese origen a connect-src.
  # En ambos modos cualquier /api/... responde JSON, nunca el index.html de la SPA.
  include /etc/nginx/snippets/sigat-api.conf;

  # SPA: cualquier otra ruta devuelve index.html (sin caché).
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/sigat-security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
