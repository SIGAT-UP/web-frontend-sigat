server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo vuelve a index.html.
    # Sin esto, recargar /predios/123 devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index no se cachea: un despliegue nuevo debe verse de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Healthcheck para Coolify y para docker run.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
